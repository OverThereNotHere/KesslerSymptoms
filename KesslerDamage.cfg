// Adds Kessler Symptoms' debris damage module to every part that can be damaged:
// deployables (stock breakage + free repair) and anything holding resources (punctures).
// :FINAL so parts added by other mods are covered too.

@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleDeployableAntenna],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleDeployableRadiator],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@RESOURCE[*],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

// Tier 3 failures: RCS blocks, RTGs and other generators, fuel cells (converters),
// pods/probe cores (SAS) and antennas (signal loss).
@PART[*]:HAS[@MODULE[ModuleRCSFX],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleRCS],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleGenerator],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleResourceConverter],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}

@PART[*]:HAS[@MODULE[ModuleDataTransmitter],!MODULE[ModuleKesslerDamage]]:FINAL
{
    MODULE { name = ModuleKesslerDamage }
}
