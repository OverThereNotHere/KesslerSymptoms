KESSLER_SYMPTOMS
{
	EffectsEnabled = True // Master switch; debris tracking keeps running when off
	Tier1Enabled = True // Micrometeorite pings, sounds, warning
	Tier2Enabled = True // Panels and antennas can break, rare tank punctures
	Tier3Enabled = True // Large impacts: leaks, shorts, engine jams
	RailsWarpEncounters = True // Roll encounters in rails warp; tier 1 keeps warping, tier 2/3 drop you to 1x
	DebrisDecayEnabled = False // Delete old debris after a lifetime based on periapsis height (never on airless bodies)
	DebrisWeightMultiplier = 0.25 // Density one orbiting debris vessel adds to the bands it sweeps
	ExplosionSpike = 0.5 // Density added where a part is destroyed in orbit
	ExplosionHalfLifeDays = 30 // Game days for an explosion spike to fade to half
	Tier1At = 2 // Sparse: micrometeorite pings
	Tier2At = 8 // Dense: panels and antennas can break
	Tier3At = 20 // Debris field: large impacts
	HitsPerHourPerDensity = 10 // Average impacts per game hour = this x band density (off rails only)
	AlertCooldownSeconds = 30 // Real seconds between impact alarms; hits in between still ping, just without the alarm
	PingVolume = 1 // Volume of impact sounds (x ship volume)
	AlarmVolume = 0.7 // Volume of the impact alarm (x UI volume)
	Tier2Impulse = 0.1 // Push (tonne m/s) a tier 2 hit gives the part it strikes
	Tier3Impulse = 0.5 // Push (tonne m/s) a tier 3 hit gives the part it strikes
	FieldChanceMax = 0.6 // Highest chance (0-1) that an encounter is a debris field
	FieldHalfDensity = 10 // Density at which field chance reaches half its max
	FieldDurationMin = 8 // Shortest debris field, game seconds
	FieldDurationMax = 20 // Longest debris field, game seconds (rails warp is locked during fields)
	FieldSecondsPerHit = 2.5 // Average game seconds between real hits in a field
	FieldPeltsPerSecond = 6 // Sound-only micro pelts per game second in a field
	PeltVolume = 0.35 // Micro pelt volume as a fraction of impact volume
	DecayBaseHours = 120 // Game hours debris lasts with periapsis at the top of the atmosphere
	DecayScaleHeightFraction = 0.06 // Lifetime x e for every (this x atmosphere depth) of periapsis height
	DecayRandomness = 0.5 // Each piece's lifetime is scaled by e^(+/- this)
	ScanIntervalSeconds = 5 // Real-time seconds between debris scans
	BandsPerBody = 12 // Altitude bands generated around each body
	CeilingRadii = 12 // Top of the band shell, capped at the SOI
	BandGrowth = 1.35 // Thickness ratio between consecutive bands (1 = uniform)
}
