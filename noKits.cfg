// Removes repair kit requirement across stock and modded repair modules
// thank you gemini

@PART[*]:HAS[@MODULE[ModuleRepairable]]:FINAL
{
    @MODULE[ModuleRepairable]
    {
        @repairKitsRequired = 0
        @repairKitName = 
    }
}

@PART[*]:HAS[@MODULE[ModuleWheelDamage]]:FINAL
{
    @MODULE[ModuleWheelDamage]
    {
        @repairKitsRequired = 0
    }
}

@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel]]:FINAL
{
    @MODULE[ModuleDeployableSolarPanel]
    {
        @repairKitsRequired = 0
    }
}